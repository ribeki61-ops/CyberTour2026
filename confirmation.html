<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cybertour 2026 — Confirmation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/confirmation.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="confirm-page">

    <div class="confirm-logo">CYBERTOUR 2026</div>

    <div class="confirm-card">
      <div class="confirm-card__body">

        <div class="confirm-status">
          <div class="confirm-status__dot"></div>
          <span class="confirm-status__text">Participation enregistrée</span>
        </div>

        <h1 class="confirm-title">Votre lot<br>vous attend.</h1>

        <div class="confirm-prize">
          <div class="confirm-prize__label">Vous avez gagné</div>
          <div class="confirm-prize__name" id="confirm-prize-name">—</div>
        </div>

        <p class="confirm-instructions">
          Présentez-vous au <strong>stand Cybertour</strong> avec cet écran
          pour récupérer votre lot.
        </p>

      </div>

      <div class="confirm-card__foot">
        <a href="game.html" class="btn btn-ghost btn-lg">Retour à l'accueil</a>
        <p class="confirm-note text-muted">Une seule participation par personne et par événement.</p>
      </div>
    </div>

  </div>

  <script type="module">
    import { rain } from './assets/js/confetti.js';

    const lot = sessionStorage.getItem('ct26_lot') || 'Lot Cybertour';
    document.getElementById('confirm-prize-name').textContent = lot;

    rain();
  </script>

</body>
</html>
